# Gather visuals for every short that has a spec.json but no assets yet.
# Runs every hour, or any time from Actions -> "Gather visuals" -> "Run workflow".
#
# Private repo? Every run costs at least 1 of your 2,000 free minutes a month
# (hourly = about 720 a month). To save minutes, change the cron line below to
# "7 */3 * * *" (every 3 hours). Public repos run free.
name: Gather visuals

on:
  # PAUSED 2026-11-26 (creative rework). To resume, uncomment the two lines below.
  # schedule:
  #   - cron: "7 * * * *"   # minute 7 of every hour (UTC); :00 is GitHub's busiest
  workflow_dispatch:

# Never run two gathers at the same time.
concurrency:
  group: gather
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TRACKER_SHEET_ID: ${{ vars.TRACKER_SHEET_ID }}
      DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install
        run: pip install -r requirements-pipeline.txt

      - name: Gather
        run: python -m pipeline.gather
